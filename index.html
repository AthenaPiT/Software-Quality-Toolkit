<!doctype html>
<!--
  GitHub Pages entry point.
  The application itself is SoftwareQualityToolkit.html; this file exists so
  that https://<owner>.github.io/<repo>/ resolves without renaming it.
  All paths are relative, so a project sub-path works unchanged.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Quality Toolkit</title>
<link rel="icon" href="assets/sqt-logo.png">
<meta http-equiv="refresh" content="0; url=SoftwareQualityToolkit.html">
<style>
  :root{ color-scheme:dark; }
  html,body{ height:100%; margin:0; }
  body{
    display:grid; place-content:center; justify-items:center; gap:18px;
    background:#08090c; color:#eef1f6;
    font:14px/1.6 "Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 46% 40% at 50% 46%,rgba(82,115,255,.10),transparent 70%);
  }
  img{ width:64px; height:64px; object-fit:contain; filter:drop-shadow(0 4px 22px rgba(82,115,255,.3)); }
  p{ margin:0; color:#6e7889; font-size:12px; }
  p strong{ color:#eef1f6; font-weight:600; letter-spacing:-.01em; }
  a{
    color:#a9baff; font-size:12px; text-decoration:none;
    border:1px solid rgba(82,115,255,.34); background:rgba(82,115,255,.10);
    padding:7px 14px; border-radius:8px;
  }
  a:hover{ background:rgba(82,115,255,.2); }
  .bar{ width:132px; height:2px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i{ display:block; width:38%; height:100%; background:#5273ff; animation:slide 1.1s cubic-bezier(.22,.7,.28,1) infinite; }
  @keyframes slide{ from{ transform:translateX(-100%); } to{ transform:translateX(360%); } }
  @media (prefers-reduced-motion:reduce){ .bar i{ animation:none; width:100%; } }
</style>
</head>
<body>
  <img src="assets/sqt-logo.png" alt="Software Quality Toolkit">
  <div class="bar" aria-hidden="true"><i></i></div>
  <p>Opening <strong>Software Quality Toolkit</strong>&hellip;</p>
  <a href="SoftwareQualityToolkit.html">Open manually</a>
  <script>location.replace('SoftwareQualityToolkit.html');</script>
</body>
</html>
